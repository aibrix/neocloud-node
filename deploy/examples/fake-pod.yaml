apiVersion: v1
kind: Pod
metadata:
  name: neocloud-node-fake-smoke
  annotations:
    cloud.aibrix.ai/provider: fake
    cloud.aibrix.ai/gpu-type: NVIDIA A100
spec:
  restartPolicy: Never
  nodeSelector:
    cloud.aibrix.ai/provider: fake
  tolerations:
    - key: cloud.aibrix.ai/provider
      operator: Equal
      value: fake
      effect: NoSchedule
  containers:
    - name: smoke
      image: busybox:1.36
      command: ["sh", "-c"]
      args: ["echo neocloud-node-smoke"]
      resources:
        limits:
          nvidia.com/gpu: "1"
