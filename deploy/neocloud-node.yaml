apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: aibrix
  name: aibrix-system
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: aibrix
  name: cloudpodbindings.cloud.aibrix.ai
spec:
  group: cloud.aibrix.ai
  names:
    kind: CloudPodBinding
    plural: cloudpodbindings
    shortNames:
    - cpb
    singular: cloudpodbinding
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.request.provider
      name: Provider
      type: string
    - jsonPath: .status.remoteID
      name: RemoteID
      type: string
    - jsonPath: .status.deleting
      name: Deleting
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              podName:
                type: string
              workloadUID:
                type: string
            required:
            - workloadUID
            type: object
          status:
            properties:
              attempts:
                items:
                  properties:
                    class:
                      type: string
                    fallbackAllowed:
                      type: boolean
                    message:
                      type: string
                    provider:
                      type: string
                    reason:
                      type: string
                    region:
                      type: string
                    retryable:
                      type: boolean
                    timestamp:
                      format: date-time
                      type: string
                  type: object
                type: array
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
              cost:
                properties:
                  hourlyUSD:
                    type: number
                  observedAt:
                    format: date-time
                    type: string
                  source:
                    type: string
                type: object
              deleting:
                type: boolean
              lastError:
                type: string
              phase:
                type: string
              placement:
                properties:
                  gpuType:
                    type: string
                  provider:
                    type: string
                  region:
                    type: string
                type: object
              podName:
                type: string
              remoteID:
                type: string
              request:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              workloadUID:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: aibrix
  name: aibrix-neocloud-node
  namespace: aibrix-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: aibrix
  name: aibrix-neocloud-node
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - ""
  resources:
  - pods/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - create
  - get
- apiGroups:
  - ""
  resources:
  - nodes/status
  verbs:
  - patch
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - update
- apiGroups:
  - cloud.aibrix.ai
  resources:
  - cloudpodbindings
  verbs:
  - create
