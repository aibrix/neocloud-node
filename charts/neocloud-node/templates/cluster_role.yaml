apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "neocloud.clusterName" . }}
rules:
  # Virtual Kubelet constructs shared informers for these resources, which
  # needs list/watch. The controller also reads Secrets and ConfigMaps that
  # remote Pods reference in env and envFrom when it creates the remote
  # workload; the values are sent to the provider.
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete", "get", "list", "patch", "watch"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "update"]
  - apiGroups: ["cloud.aibrix.ai"]
    resources: ["cloudpodbindings"]
    verbs: ["create", "delete", "get", "list", "update"]
  - apiGroups: ["cloud.aibrix.ai"]
    resources: ["cloudpodbindings/status"]
    verbs: ["get", "update"]
