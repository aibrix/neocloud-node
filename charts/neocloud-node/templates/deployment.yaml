apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neocloud.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
      app.kubernetes.io/name: neocloud-node
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
        app.kubernetes.io/name: neocloud-node
    spec:
      serviceAccountName: {{ include "neocloud.name" . }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        {{- if .Values.lambdaSSH.secretName }}
        fsGroup: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aibrix-neocloud-node
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --node-name=$(GPU_BURST_NODE_NAME)
            - --provider=$(GPU_BURST_PROVIDER)
            - --fallback-providers=$(GPU_BURST_FALLBACK_PROVIDERS)
            - --binding-store=kubernetes
            - --listen-addr=:10250
            {{- if .Values.kubeletAPI.enabled }}
            - --enable-kubelet-api
            - --kubelet-auth-mode={{ required "kubeletAPI.authenticationMode must explicitly be none for isolated development" .Values.kubeletAPI.authenticationMode }}
            {{- if .Values.kubeletAPI.tlsSecretName }}
            - --tls-cert-file=/etc/neocloud-kubelet-tls/tls.crt
            - --tls-key-file=/etc/neocloud-kubelet-tls/tls.key
            {{- end }}
            {{- end }}
            - --advertise-gpu-count=$(GPU_BURST_ADVERTISE_GPU_COUNT)
            - --advertise-pod-capacity=$(GPU_BURST_ADVERTISE_POD_CAPACITY)
            - --status-sync-interval=$(GPU_BURST_STATUS_SYNC_INTERVAL)
            - --orphan-sweeper-interval=$(GPU_BURST_ORPHAN_SWEEPER_INTERVAL)
            - --orphan-sweeper-dry-run=$(GPU_BURST_ORPHAN_SWEEPER_DRY_RUN)
            - --placement-offers=$(GPU_BURST_PLACEMENT_OFFERS)
            - --placement-offer-ttl=$(GPU_BURST_PLACEMENT_OFFER_TTL)
            - --placement-refresh-interval=$(GPU_BURST_PLACEMENT_REFRESH_INTERVAL)
            - --placement-signal-cooldown=$(GPU_BURST_PLACEMENT_SIGNAL_COOLDOWN)
          env:
            - name: GPU_BURST_PROVIDER
              value: {{ .Values.provider | quote }}
            - name: GPU_BURST_NODE_NAME
              value: {{ .Values.nodeName | quote }}
            {{- if .Values.kubeletAPI.enabled }}
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- end }}
            {{- if .Values.lambdaSSH.secretName }}
            - name: GPU_BURST_LAMBDA_SSH_USER
              value: {{ .Values.lambdaSSH.user | quote }}
            - name: GPU_BURST_LAMBDA_SSH_PRIVATE_KEY_FILE
              value: /etc/neocloud-lambda-ssh/ssh-privatekey
            - name: GPU_BURST_LAMBDA_SSH_KNOWN_HOSTS_FILE
              value: /etc/neocloud-lambda-ssh/known_hosts
            {{- end }}
            {{- if .Values.runnerCallback.enabled }}
            - name: GPU_BURST_RUNNER_CALLBACK_ADDR
              value: ':9091'
            - name: GPU_BURST_RUNNER_CALLBACK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "runnerCallback.secretName is required" .Values.runnerCallback.secretName | quote }}
                  key: {{ .Values.runnerCallback.secretKey | quote }}
            - name: GPU_BURST_LAMBDA_CALLBACK_URL
              value: {{ required "runnerCallback.url is required" .Values.runnerCallback.url | quote }}
            {{- end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | toString | quote }}
            {{- end }}
            {{- range $provider, $secret := .Values.credentials }}
            {{- if $secret.secretName }}
            - name: {{ $provider | upper }}_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret.secretName | quote }}
                  key: {{ $secret.key | quote }}
                  optional: true
            {{- end }}
            {{- end }}
          {{- if or .Values.kubeletAPI.enabled .Values.runnerCallback.enabled }}
          ports:
            {{- if .Values.kubeletAPI.enabled }}
            - name: kubelet
              containerPort: 10250
            {{- end }}
            {{- if .Values.runnerCallback.enabled }}
            - name: runner
              containerPort: 9091
            {{- end }}
          {{- end }}
          {{- if or .Values.lambdaSSH.secretName (and .Values.kubeletAPI.enabled .Values.kubeletAPI.tlsSecretName) }}
          volumeMounts:
            {{- if .Values.lambdaSSH.secretName }}
            - name: lambda-ssh
              mountPath: /etc/neocloud-lambda-ssh
              readOnly: true
            {{- end }}
            {{- if and .Values.kubeletAPI.enabled .Values.kubeletAPI.tlsSecretName }}
            - name: kubelet-tls
              mountPath: /etc/neocloud-kubelet-tls
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          terminationMessagePolicy: FallbackToLogsOnError
      {{- if or .Values.lambdaSSH.secretName (and .Values.kubeletAPI.enabled .Values.kubeletAPI.tlsSecretName) }}
      volumes:
        {{- if .Values.lambdaSSH.secretName }}
        - name: lambda-ssh
          secret:
            secretName: {{ .Values.lambdaSSH.secretName | quote }}
            defaultMode: 0440
            items:
              - key: {{ .Values.lambdaSSH.privateKeyKey | quote }}
                path: ssh-privatekey
              - key: {{ .Values.lambdaSSH.knownHostsKey | quote }}
                path: known_hosts
        {{- end }}
        {{- if and .Values.kubeletAPI.enabled .Values.kubeletAPI.tlsSecretName }}
        - name: kubelet-tls
          secret:
            secretName: {{ .Values.kubeletAPI.tlsSecretName | quote }}
        {{- end }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
