apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cloudpodbindings.cloud.aibrix.ai
spec:
  group: cloud.aibrix.ai
  scope: Namespaced
  names:
    plural: cloudpodbindings
    singular: cloudpodbinding
    kind: CloudPodBinding
    shortNames:
      - cpb
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Provider
          type: string
          jsonPath: .status.request.provider
        - name: RemoteID
          type: string
          jsonPath: .status.remoteID
        - name: Deleting
          type: boolean
          jsonPath: .status.deleting
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - workloadUID
              properties:
                podName:
                  type: string
                workloadUID:
                  type: string
            status:
              type: object
              properties:
                podName:
                  type: string
                workloadUID:
                  type: string
                phase:
                  type: string
                remoteID:
                  type: string
                deleting:
                  type: boolean
                lastError:
                  type: string
                request:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                placement:
                  type: object
                  properties:
                    provider:
                      type: string
                    region:
                      type: string
                    gpuType:
                      type: string
                cost:
                  type: object
                  properties:
                    hourlyUSD:
                      type: number
                    source:
                      type: string
                    observedAt:
                      type: string
                      format: date-time
                attempts:
                  type: array
                  items:
                    type: object
                    properties:
                      provider:
                        type: string
                      region:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      class:
                        type: string
                      retryable:
                        type: boolean
                      fallbackAllowed:
                        type: boolean
                      timestamp:
                        type: string
                        format: date-time
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
