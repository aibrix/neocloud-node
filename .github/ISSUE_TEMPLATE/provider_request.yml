name: Provider integration request
description: Suggest a provider to support
title: "[Provider]: "
labels: [provider, enhancement, triage]
body:
  - type: input
    id: provider
    attributes:
      label: Provider name
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Official API documentation
      placeholder: https://...
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What workloads would you run on this provider?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional API capabilities or limitations, and whether you can help implement or test the adapter. Do not share credentials.
