name: Bug report
description: Report a NeoCloud Node defect
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Remove secrets and private resource identifiers from examples and logs.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal Pod manifest if relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provider, NeoCloud Node version or commit, and Kubernetes version (if known).
  - type: textarea
    id: logs
    attributes:
      label: Logs or other context
      description: Include relevant events or logs, and any remote resources still needing cleanup.
