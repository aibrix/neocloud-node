name: Bug report
description: Report a reproducible NeoCloud Node defect
title: "[Bug]: "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before filing. Never include API keys, SSH keys,
        callback secrets, private endpoints, account IDs, or paid resource IDs.
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - fake
        - RunPod
        - Lambda Cloud
        - Vast.ai
        - Provider-independent
        - Other
    validations:
      required: true
  - type: input
    id: kubernetes_version
    attributes:
      label: Kubernetes version
      description: Provide the server version without cluster addresses or other private details.
      placeholder: v1.31.4
    validations:
      required: true
  - type: input
    id: manifest_version
    attributes:
      label: Manifest version
      description: NeoCloud Node release, install manifest tag, image digest, or git commit in use.
      placeholder: v0.1.0, sha256:..., or 0123456789abcdef
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: List the commands or steps needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: pod_manifest
    attributes:
      label: Minimal Pod manifest
      description: Include a minimal sanitized manifest when the problem involves a Pod.
      render: yaml
  - type: textarea
    id: state
    attributes:
      label: Kubernetes and binding state
      description: Include sanitized Pod events, CloudPodBinding status, and relevant controller logs.
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Additional environment details
      placeholder: |
        Installation method:
        Controller configuration:
        Provider API or region:
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials and private or billable resource identifiers.
          required: true
        - label: I checked for leaked remote resources and described any cleanup still required.
          required: true
