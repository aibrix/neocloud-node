name: Pod compatibility request
description: Request support for a Pod field or workload behavior
title: "[Pod compatibility]: "
labels: [enhancement, triage]
body:
  - type: markdown
    attributes:
      value: Remove secrets and private resource identifiers from examples and logs.
  - type: textarea
    id: capability
    attributes:
      label: Requested behavior
      description: Which Pod field or behavior do you need, and for what use case?
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: Minimal Pod manifest
      render: yaml
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: Include the rejection reason or relevant events, if available.
  - type: textarea
    id: environment
    attributes:
      label: Environment or constraints
      description: Provider, versions, and relevant provider limitations (if known).
