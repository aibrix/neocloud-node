[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neocloud-trace"
version = "0.1.0"
description = "Budget-bounded NeoCloud availability and capacity trace runner"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
neocloud-trace = "neocloud_trace.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
