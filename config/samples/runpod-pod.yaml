apiVersion: v1
kind: Pod
metadata:
  name: qwen-vllm
  namespace: default
  annotations:
    cloud.aibrix.ai/provider: runpod
    cloud.aibrix.ai/gpu-type: NVIDIA A40
    cloud.aibrix.ai/runpod-cloud-type: SECURE
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: neocloud-node
  tolerations:
    - key: cloud.aibrix.ai/provider
      operator: Equal
      value: runpod
      effect: NoSchedule
  containers:
    - name: vllm
      image: vllm/vllm-openai:v0.32.0
      imagePullPolicy: IfNotPresent
      command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - --model
        - Qwen/Qwen2.5-1.5B-Instruct
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --dtype
        - half
        - --max-model-len
        - '2048'
        - --gpu-memory-utilization
        - '0.80'
        - --enforce-eager
      resources:
        limits:
          nvidia.com/gpu: "1"
