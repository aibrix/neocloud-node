apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aibrix-neocloud-node
rules:
  # Virtual Kubelet constructs shared informers for these resources. Downward
  # API resolution remains disabled, but list/watch is required by nodeutil.
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete", "get", "list", "patch", "watch"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "update"]
  - apiGroups: ["cloud.aibrix.ai"]
    resources: ["cloudpodbindings"]
    verbs: ["create", "delete", "get", "list", "update"]
  - apiGroups: ["cloud.aibrix.ai"]
    resources: ["cloudpodbindings/status"]
    verbs: ["get", "update"]
