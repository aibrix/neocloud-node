apiVersion: v1
kind: Pod
metadata:
  name: qwen-sglang
  namespace: default
  annotations:
    cloud.aibrix.ai/provider: runpod
    cloud.aibrix.ai/gpu-type: NVIDIA A40
    cloud.aibrix.ai/runpod-cloud-type: SECURE
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: neocloud-node
  tolerations:
    - key: cloud.aibrix.ai/provider
      operator: Equal
      value: runpod
      effect: NoSchedule
    # DOKS only: temporary virtual-node workaround; see issue #73.
    - key: readiness.k8s.io/DOKSCriticalComponentsReady
      operator: Equal
      value: pending
      effect: NoSchedule
  containers:
    - name: sglang
      image: lmsysorg/sglang:v0.5.23
      imagePullPolicy: IfNotPresent
      command:
        - python3
        - -m
        - sglang.launch_server
      args:
        - --model-path
        - Qwen/Qwen2.5-1.5B-Instruct
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --dtype
        - float16
        - --context-length
        - '2048'
        - --mem-fraction-static
        - '0.80'
        - --disable-cuda-graph
      ports:
        - name: http
          containerPort: 8000
          protocol: TCP
      # The controller runs this probe against the RunPod public endpoint for
      # port 8000. The Pod becomes Ready only after the model server answers.
      readinessProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      resources:
        limits:
          nvidia.com/gpu: '1'
